name: phase 3

# The same discipline as the Phase 0 workflow (docs/08-roadmap.md §8.3), applied to the compiler.
#
# Phase 2 added the exit criterion itself as a job: the corpus, checked with no annotations; the
# security suite; and a three-module project that links. Phase 3 adds `beck test` — the programs'
# *own* tests, run by the command an outside developer runs. Those are gates, not reports.
#
# What is a *gate* and what is merely *reported* stays a deliberate distinction (§13.7): the
# harnesses, the round-trip property and the licence check fail the build; timings are printed but
# never thresholded, because a shared CI runner cannot hold a timing threshold honestly and "a gate
# that flakes gets deleted".

on:
  push:
    branches: [main]
    # All of .github/workflows/: the workflow checks here scan every workflow file, so they must
    # run when any of them changes (docs/adr/0005).
    paths: ["compiler/**", ".github/workflows/**"]
  pull_request:
    paths: ["compiler/**", ".github/workflows/**"]
  workflow_dispatch:
  # `release.yml` calls this workflow rather than restating its gates, which is what makes §28.2
  # item 1's "no release-only build steps" a fact about the pipeline instead of a promise about it:
  # a tag re-runs *these* jobs on the tagged commit, and the release refuses on any red.
  workflow_call:

# None of these jobs writes to the repository.
permissions:
  contents: read

# A superseded push to a PR cancels the runs it superseded; `main` never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: compiler

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  the-workflows-are-yaml:
    # Every workflow file through a real parser, in both workflows: if this file is the broken
    # one, GitHub refuses it and only phase0.yml's copy can say so, and vice versa (docs/adr/0005).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: every workflow file parses
        working-directory: .
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          assert files, "no workflow files found — the glob is wrong, not the repo"
          for f in files:
              yaml.safe_load(open(f))
              print(f, "parses")
          PY
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beck_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # beck-rt's log contract runs against a live Postgres; REQUIRE makes a missing server a
      # failure rather than a silent skip.
      BECK_PG: postgres://postgres:postgres@localhost/beck_ci
      BECK_REQUIRE_PG: "1"
      # `native.rs`, `cranelift.rs` and `measure_native.rs` skip when there is no `clang` and no
      # linker, and print why. This runner has both, so a skip here would mean the differential
      # between backends silently did not run — which is the failure mode §19.4 item 10 is about.
      # One switch for both halves: a machine with `clang` has a linker.
      BECK_REQUIRE_LLVM: "1"
      # `image.rs` reads its layer back with somebody else's tar and its signature with somebody
      # else's verifier. Both are on this runner, so a skip would mean the image build was checked
      # only by the code that wrote it (docs/99 §99.3).
      BECK_REQUIRE_TAR: "1"
      BECK_REQUIRE_OPENSSL: "1"
      # `release.rs` runs the installer against a corrupted archive. A skip here would mean nothing
      # checked that a bad checksum stops an install (docs/104 §104.8).
      BECK_REQUIRE_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml's pin (1.94.1, with components) wins over the default this action
      # sets; the action only ensures rustup is present and current.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      # The differential harness is §4.8's "highest-value test in the project" and §8.3's "the
      # project's conscience"; the replay harness is the determinism rule of §3.7, cashed in. They
      # run with everything else, but they are the reason this job exists.
      - name: tests, including the differential and replay harnesses
        run: cargo test --workspace --all-targets

  the-sketch-still-compiles-and-runs:
    # "Every phase ships a demo that runs. No phase completes on a design document." (§8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: build
        run: cargo build --release

      - name: the sketch typechecks, places and slices
        run: ./target/release/beck check examples/todo.beck

      - name: "`beck fmt` round-trips and is idempotent"
        run: |
          ./target/release/beck fmt examples/todo.beck > /tmp/a.beck
          ./target/release/beck fmt /tmp/a.beck        > /tmp/b.beck
          diff /tmp/a.beck /tmp/b.beck
          ./target/release/beck check /tmp/a.beck
          # …and the canonical surface reads the same program.
          ./target/release/beck fmt examples/todo.beck --surface sexpr > /tmp/a.sx
          ./target/release/beck check /tmp/a.sx

      - name: the app serves the page it compiled
        run: |
          ./target/release/beck run examples/todo.beck --addr 127.0.0.1:8080 --path /tmp/beck.log &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 0.25; done
          curl -sf "http://127.0.0.1:8080/?actor=ci" | tee /tmp/page.html | head -c 400
          # SSR is the data, rendered — not a shell that fetches it.
          grep -q '<footer>0 remaining</footer>' /tmp/page.html
          grep -q 'data-b-enter=' /tmp/page.html
          # No user JavaScript in Mode A. The property is not "one script tag" — the residue is
          # several files now that Mode B shares its patch interpreter (docs/94) — it is that every
          # script the document loads is *compiler residue served by this server*, and that none of
          # it is inline. That is also the CSP story §5.1 claims: `script-src 'self'`, no
          # `unsafe-inline`.
          test "$(grep -o '<script' /tmp/page.html | wc -l)" \
             = "$(grep -o '<script src="/beck-[a-z0-9-]*\.js" defer></script>' /tmp/page.html | wc -l)"
          # …and in Mode A that residue is the thin client, not the kernel.
          grep -q '<script src="/beck-thin.js" defer></script>' /tmp/page.html
          ! grep -q 'beck-mode-b.js' /tmp/page.html
          kill %1

      - name: replay is exact
        run: ./target/release/beck replay examples/todo.beck --path /tmp/beck.log --verify

      - name: and the same app runs and replays on SQLite
        # docs/67. The substrate that makes rungs 0-2 production-shaped has to be one `beck run`
        # actually accepts, not only one the unit tests construct — and `--verify` is what says the
        # log it wrote folds to the same state twice.
        run: |
          ./target/release/beck run examples/todo.beck --addr 127.0.0.1:8081 \
            --store sqlite --path /tmp/beck.sqlite &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8081/healthz >/dev/null && break; sleep 0.25; done
          curl -sf "http://127.0.0.1:8081/?actor=ci" | grep -q '<footer>0 remaining</footer>'
          kill %1
          sleep 1
          ./target/release/beck replay examples/todo.beck --store sqlite \
            --path /tmp/beck.sqlite --verify | grep -q 'replay is exact'

      - name: the programs' own tests pass
        # docs/21 §21.2, run the way a person runs it. This is a different claim from `cargo test`:
        # that suite tests the *compiler*, and this one runs tests written in Beck, about Beck
        # programs, through the same roles the runtime drives.
        run: |
          ./target/release/beck test examples/todo.beck --verbose
          # docs/66: the checked-in page snapshot is compared, not rewritten. `--update` is the
          # only thing that writes one, so a run without it that leaves `git status` dirty means a
          # snapshot rewrote itself — which would make the assertion a log rather than a test.
          git diff --quiet examples/snapshots/ \
            || { echo 'a beck test run without --update rewrote a snapshot'; exit 1; }
          for f in corpus/*.beck; do
            # Not every corpus program carries tests; the ones that do must pass.
            ./target/release/beck test "$f"
          done
          # docs/25 §25.6: SICP chapters 1 and 2, asserted against the answers the book states. Both
          # are *libraries* — no merge point, no application — which `beck test` could not run
          # before docs/27 §27.2, and running them the way a person does is the claim. The walls
          # beyond them are held by tests/sicp.rs, which `cargo test` above already runs.
          ./target/release/beck test sicp/ch1.beck
          ./target/release/beck test sicp/ch2.beck
          # docs/87: chapter 3, the chapter the language disagrees with — §3.1's objects with the
          # state they hide written down, §3.3.4's circuit simulator at the times the book prints,
          # and §3.5.5's account with no assignment, asserted to agree with §3.1.1's fold.
          ./target/release/beck test sicp/ch3.beck
          # docs/63: §25.9's Felleisen table — one section per special form SICP introduces, each
          # carrying the code that recovers it or the reorganisation that concedes it.
          ./target/release/beck test sicp/felleisen.beck
          # docs/53: Are We Fast Yet, verified against the original suite's own constants. Run the
          # way a person runs it, for the same reason the SICP chapters are — `cargo test` above
          # already drives tests/awfy.rs, and this is the claim that the binary does it too.
          for f in awfy/*.beck; do
            ./target/release/beck test "$f"
          done
          # docs/68: the Computer Language Benchmarks Game, verified against the Game's own
          # published output files under clbg/expected/. Same reason as awfy/ above — `cargo test`
          # drives tests/clbg.rs, and this is the claim that the binary does it too.
          for f in clbg/*.beck; do
            ./target/release/beck test "$f"
          done
          # docs/27: a recursion the user cannot bound must end in a diagnostic and a live process.
          # An exit status of 134 (SIGABRT) or 139 (SIGSEGV) is the failure this replaced, and it is
          # exactly the thing a `! cmd` gate would have accepted, so the status is checked rather
          # than only the failure.
          python3 - <<'PY'
          open("/tmp/deep.beck", "w").write(
              'def up(n: Int) -> Int:\n'
              '    if n == 0:\n'
              '        return 0\n'
              '    return 1 + up(n - 1)\n'
              '\n'
              'test "past the ceiling":\n'
              '    expect up(100000) == 100000\n')
          PY
          set +e
          ./target/release/beck test /tmp/deep.beck >/tmp/deep.out 2>/tmp/deep.err
          code=$?
          set -e
          cat /tmp/deep.out /tmp/deep.err
          test "$code" -ne 0        # the test fails…
          test "$code" -lt 128      # …by failing, not by dying on a signal
          grep -q "which is the evaluator's limit" /tmp/deep.out
          ! grep -q 'overflowed its stack' /tmp/deep.err
          # And the same recursion in tail position has no ceiling at all.
          python3 - <<'PY'
          open("/tmp/iterative.beck", "w").write(
              'def up(acc: Int, n: Int) -> Int:\n'
              '    if n == 0:\n'
              '        return acc\n'
              '    return up(acc + 1, n - 1)\n'
              '\n'
              'test "an iterative process":\n'
              '    expect up(0, 1000000) == 1000000\n')
          PY
          ./target/release/beck test /tmp/iterative.beck
          # docs/27: the last two walls. Reals reproduce the doubles SICP prints, and a user-written
          # polymorphic definition is instantiated afresh at every call — asserted here through the
          # binary because `cargo test` above asserts it through the library, and the claim is that
          # a person gets it too.
          ./target/release/beck test corpus/26-sensors.beck
          python3 - <<'PY'
          open("/tmp/generic.beck", "w").write(
              'def map[T, U](xs: list[T], f: T -> U) -> list[U]:\n'
              '    return map_list(xs, f)\n'
              '\n'
              'test "one map, three element types":\n'
              '    expect map([1, 2], lambda n: n * 2) == [2, 4]\n'
              '    expect map(["a"], lambda s: s + "!") == ["a!"]\n'
              '    expect map([1.5], lambda x: x * 2.0) == [3.0]\n')
          PY
          ./target/release/beck test /tmp/generic.beck
          # And a type parameter is rigid: a body that assumes `T` is `Int` is a lie the checker
          # has to catch, or the polymorphism is decorative.
          python3 - <<'PY'
          open("/tmp/rigid.beck", "w").write(
              'def f[T](x: T) -> Int:\n    return x + 1\n')
          PY
          ! ./target/release/beck check /tmp/rigid.beck
          ./target/release/beck check /tmp/rigid.beck 2>&1 | grep -q 'found `T`'
          # docs/27: a list can be taken apart, and a `match` on one has to cover both shapes.
          python3 - <<'PY'
          open("/tmp/fold.beck", "w").write(
              'def accumulate[T, U](xs: list[T], seed: U, combine: (T, U) -> U) -> U:\n'
              '    match xs:\n'
              '        case []:\n'
              '            return seed\n'
              '        case [first, *rest]:\n'
              '            return combine(first, accumulate(rest, seed, combine))\n'
              '\n'
              'test "one fold, two element types":\n'
              '    expect accumulate([1, 2, 3], 0, lambda x, acc: x + acc) == 6\n'
              '    expect accumulate(["a", "b"], "", lambda s, acc: s + acc) == "ab"\n')
          open("/tmp/partial.beck", "w").write(
              'def f(xs: list[Int]) -> Int:\n'
              '    match xs:\n'
              '        case []:\n'
              '            return 0\n')
          PY
          ./target/release/beck test /tmp/fold.beck
          ! ./target/release/beck check /tmp/partial.beck
          ./target/release/beck check /tmp/partial.beck 2>&1 | grep -q 'B0341'
          # docs/27: and a pure caller of a generic higher-order definition stays pure, however
          # another caller uses it. Read off the *published contract*, which is where it was wrong.
          python3 - <<'PY'
          open("/tmp/rows.beck", "w").write(
              'def twice[T](f: (T) -> T, x: T) -> T:\n'
              '    return f(f(x))\n'
              '\n'
              'def plain(n: Int) -> Int:\n'
              '    return twice(lambda m: m + 1, n)\n'
              '\n'
              'def stamped(n: Int) -> Int:\n'
              '    return twice(lambda m: m + now(), n)\n')
          PY
          ./target/release/beck iface /tmp/rows.beck --stdout | tee /tmp/rows.becki
          grep -q 'def plain(n: Int) -> Int$' /tmp/rows.becki
          grep -q 'def stamped(n: Int) -> Int uses nondet$' /tmp/rows.becki
          # A failing test has to fail the build, or the gate is decorative. This is the property
          # docs/19 §19.4 item 10 says an unexecuted artefact cannot have.
          python3 - <<'PY'
          src = open("examples/todo.beck").read()
          src += '\ntest "deliberately false":\n    given []\n    expect list_len(events) == 1\n'
          open("/tmp/failing.beck", "w").write(src)
          PY
          ! ./target/release/beck test /tmp/failing.beck

      - name: the signal graph is sliced as a graph
        # docs/23. Two `durable` folds compiled and were mis-sliced for two phases, so the gate is
        # that such a program now *runs*, and that `beck explain flow` reports the graph the slicer
        # actually read rather than a fixed four-line summary.
        run: |
          ./target/release/beck explain flow corpus/21-two-folds.beck | tee /tmp/flow.txt
          grep -q '2 durable folds, fused into one record' /tmp/flow.txt
          grep -q 'tier crossings' /tmp/flow.txt
          # A computation read by two consumers is named as shared — §5.3's input.
          ./target/release/beck explain flow corpus/22-shared.beck | grep -q 'shared: tally'
          # And the shapes that are still refused are refused *by name*, not by silence.
          python3 - <<'PY'
          src = open("corpus/21-two-folds.beck").read()
          src += '\nadmin: Signal[Html] = map2(render, tally, roster)\n'
          open("/tmp/two-pages.beck", "w").write(src)
          PY
          ! ./target/release/beck check /tmp/two-pages.beck
          ./target/release/beck check /tmp/two-pages.beck 2>&1 | grep -q 'B0510'

      - name: views are maintained, and the report says so about each program
        # docs/24. The gate is the *first line*, as it was when the answer was "nothing is
        # maintained" (docs/23 §23.8): a command called `explain incremental` that let a reader
        # believe their view was being maintained when it is not would be the most misleading
        # output in the compiler.
        run: |
          ./target/release/beck explain incremental examples/todo.beck | tee /tmp/inc.txt
          head -1 /tmp/inc.txt | grep -q 'maintained by delta'
          # …and the same headline names what is still not incremental.
          grep -q 'assembled in full every time' /tmp/inc.txt
          # §3.8's own example, decomposed: `remaining` is a count over an arrangement.
          grep -q 'list_len' /tmp/inc.txt
          # A program whose view holds no collection maintains nothing, and says that instead.
          ./target/release/beck explain incremental corpus/22-shared.beck | tee /tmp/inc2.txt
          head -1 /tmp/inc2.txt | grep -q 'Nothing in this view is maintained'
          # §5.3's two halves, named about a real program.
          grep -q 'shared arrangement: tally' /tmp/inc2.txt
          # Every view in the corpus is relational and therefore maintainable; that the analysis
          # *discriminates* is asserted in tests/incremental.rs, on programs written to produce
          # each verdict, because a corpus-only check would pass with an analysis that always
          # answered "incremental".
          for f in corpus/*.beck; do ./target/release/beck explain incremental "$f" > /dev/null; done

      - name: the log substrates are measured, not assumed
        # Reported, never thresholded (§13.7): a shared runner cannot hold a timing gate honestly.
        # It runs so that the table in docs/07 §7.8.1 stays reproducible rather than historical.
        run: ./target/release/beck bench log --dir /tmp/beck-bench

      - name: the sketch places itself with no annotations at all
        run: |
          # §3.3: "placement is not a primitive annotation; it is a constraint solution". Strip
          # every `@on(...)` and the solver has to land on a placement that runs.
          sed 's/^@on(server)$//;s/^@on(data)$//;s/^@on(client)$//' examples/todo.beck > /tmp/bare.beck
          ! grep -q '@on' /tmp/bare.beck
          ./target/release/beck check /tmp/bare.beck \
            --assert-place page=client \
            --assert-place todos=data \
            --assert-place proposals=server \
            --assert-place apply_event=any
          ./target/release/beck explain place /tmp/bare.beck todos

      - name: the published interface round-trips, and a body edit does not move it
        run: |
          ./target/release/beck iface examples/todo.beck -o /tmp/v1.becki
          ./target/release/beck check examples/todo.beck --wire-compat /tmp/v1.becki
          # A body edit is not a wire change (§3.6's firewall).
          sed 's/"done" if t.done else ""/"done" if t.done else " "/' examples/todo.beck > /tmp/edited.beck
          ./target/release/beck check /tmp/edited.beck --wire-compat /tmp/v1.becki
          # Adding an event variant is (§4.3's rolling-deploy rule), and must fail without --breaking.
          python3 - <<'PY'
          src = open("examples/todo.beck").read()
          src = src.replace("    Deleted(id: Id)", "    Deleted(id: Id)\n    Starred(id: Id)")
          src = src.replace(
              "        case Deleted(id):\n            return s.with(todos=map_remove(s.todos, id))",
              "        case Deleted(id):\n            return s.with(todos=map_remove(s.todos, id))\n        case Starred(id):\n            return toggled(s, id)")
          open("/tmp/v2.beck", "w").write(src)
          PY
          ! ./target/release/beck check /tmp/v2.beck --wire-compat /tmp/v1.becki
          ./target/release/beck check /tmp/v2.beck --wire-compat /tmp/v1.becki --breaking

      - name: every program in the corpus checks, and the project links
        run: |
          for f in corpus/*.beck; do
            echo "== $f"
            ./target/release/beck check "$f"
          done
          ./target/release/beck check corpus/project/app.beck
          ./target/release/beck iface corpus/project/domain.beck --stdout > /dev/null
          # docs/65: the language server starts, answers `initialize`, and exits cleanly on
          # `shutdown`/`exit`. The protocol itself is `beck-cli/tests/lsp.rs`, which `cargo test`
          # above already drives; this is the claim that the *release* binary does it too — a
          # server that only worked in a debug build is a server nobody could ship.
          python3 - <<'PY'
          import json, subprocess
          def frame(o):
              b = json.dumps(o).encode()
              return b"Content-Length: %d\r\n\r\n" % len(b) + b
          def read(f):
              n = None
              while True:
                  line = f.readline()
                  assert line, "the server closed its output"
                  t = line.strip()
                  if not t:
                      break
                  k, _, v = t.partition(b":")
                  if k.strip().lower() == b"content-length":
                      n = int(v.strip())
              return json.loads(f.read(n))
          p = subprocess.Popen(["./target/release/beck", "lsp"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          p.stdin.write(frame({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                               "params": {"capabilities": {}}}))
          p.stdin.flush()
          caps = read(p.stdout)["result"]["capabilities"]
          assert caps["hoverProvider"] and caps["definitionProvider"], caps
          p.stdin.write(frame({"jsonrpc": "2.0", "id": 2, "method": "shutdown", "params": None}))
          p.stdin.flush()
          read(p.stdout)
          p.stdin.write(frame({"jsonrpc": "2.0", "method": "exit", "params": None}))
          p.stdin.flush()
          assert p.wait() == 0, "`exit` after `shutdown` is a clean exit"
          print("beck lsp: initialize, shutdown, exit")
          PY

      - name: the object graph is what the effects imply
        run: |
          ./target/release/beck build examples/todo.beck --out /tmp/objects
          test -f /tmp/objects/explain.txt
          # `durable` ⇒ a volume and a snapshot schedule; `merge_clients()` ⇒ a websocket route.
          grep -q 'LogStore/'  /tmp/objects/explain.txt
          grep -q 'Route/'     /tmp/objects/explain.txt
          # The grant is append-only because the program is.
          grep -q 'GRANT SELECT, INSERT' /tmp/objects/k8s/*grants.yaml
          ! grep -q 'DELETE' /tmp/objects/k8s/*grants.yaml
          # The cluster manifests are on their own, so `kubectl apply -f` and a GitOps controller
          # pointed at that directory see manifests and nothing else.
          ls /tmp/objects/k8s | grep -qv apko
          test -f /tmp/objects/image.apko.yaml

  the-browser-runs-the-residue:
    # The one job that executes the JavaScript. Everything else in this workflow tests Beck against
    # Beck; `browser.rs` loads both rendering modes in headless Chromium and asserts that the DOM is
    # the page the server would have rendered (docs/94 §94.12) — and loads the playground, where the
    # compiler itself is the WebAssembly and the application runs in the tab (docs/96).
    #
    # The two `BECK_REQUIRE_*` variables are the point of the job, for the reason `conformance`
    # states about its own: both suites *skip* when the thing they need is absent, which is right on
    # a laptop and would be a silently-absent gate here. `ubuntu-latest` ships a Chromium the suite
    # finds on the path.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: the pinned toolchain gets the browser's target
        # Not the action's `targets:` input, and the difference is the reason this job failed the
        # first time it ran: `compiler/rust-toolchain.toml` pins 1.94.1, so `cargo` here selects
        # that toolchain while the action had added the target to *stable*. `rustup` respects the
        # same directory override `cargo` does, so adding it from here adds it to the toolchain
        # that will be asked for it.
        run: rustup target add wasm32-unknown-unknown

      - name: the kernel builds for the browser
        run: cargo build -p beck-wasm --release --target wasm32-unknown-unknown

      - name: the playground builds for the browser
        run: cargo build -p beck-play --release --target wasm32-unknown-unknown

      - name: both modes and the playground, in Chromium
        env:
          BECK_REQUIRE_WASM: "1"
          BECK_REQUIRE_BROWSER: "1"
        run: cargo test --test browser --test mode_b --test playground -- --nocapture

  conformance:
    # Rung 5 of the ladder in docs/21 §21.4: the API server is the only authority on whether an
    # object is admissible, and every other suite reasons about our *model* of Kubernetes. This job
    # asks Kubernetes.
    #
    # BECK_REQUIRE_CLUSTER=1 is the whole point of the job. Without it the conformance tests skip
    # when no cluster is reachable, which is right on a laptop and would be a silently-absent gate
    # here — the exact failure docs/19 §19.4 item 10 names, and the one this workflow file has
    # already committed once.
    #
    # The timeout matters here: this job fetches k3d, CRDs and images from the network, and a hang
    # would otherwise sit at GitHub's six-hour default, neither passed nor failed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: a throwaway cluster
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash
          k3d cluster create beck-conformance --wait --timeout 120s
          kubectl cluster-info

      - name: the Gateway API CRDs
        # HTTPRoute is the one object k8s-openapi does not carry, so `beck-infra`'s field names for
        # it are checked here or by nobody.
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/httproutes.gateway.networking.k8s.io

      - name: the API server admits what the compiler emits
        env:
          BECK_REQUIRE_CLUSTER: "1"
        run: cargo test -p beck-infra --test conformance -- --nocapture

      - name: and `beck build` output applies as a directory
        # The same claim at the level a person would run it, because `cargo test` writes the
        # manifests through the library and a user writes them through the CLI.
        run: |
          cargo run --release -- build examples/todo.beck --out /tmp/objects
          kubectl apply -f /tmp/objects/k8s/000-namespace.yaml
          kubectl apply --dry-run=server -f /tmp/objects/k8s
          kubectl delete namespace todo --wait=false

      - name: tear down
        if: always()
        run: k3d cluster delete beck-conformance || true

  the-second-platform:
    # A `Platform` trait with one implementation is a claim; the seam is only load-bearing if the
    # other target is exercised too. This job is rung 2 of §6.6's parity ladder — one host, real
    # containers — and it is what stops `--platform compose` from rotting into a code path nobody
    # runs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: build
        run: cargo build --release

      - name: the compose file is valid, and Docker says so rather than us
        run: |
          ./target/release/beck build examples/todo.beck --platform compose --out /tmp/compose
          docker compose -f /tmp/compose/compose/compose.yaml config > /dev/null
          # The gaps are in the output a person reads, not inferable from an absence.
          grep -q 'cannot express' /tmp/compose/explain.txt
          grep -q 'Policy/' /tmp/compose/explain.txt

      - name: the two platforms describe the same program
        run: |
          ./target/release/beck build examples/todo.beck --platform kubernetes --out /tmp/k8s
          # One derivation, two renderings: the provenance table is the platform-neutral part and
          # must be identical up to the platform section.
          sed '/^platform: /,$d' /tmp/k8s/explain.txt     > /tmp/a.txt
          sed '/^platform: /,$d' /tmp/compose/explain.txt > /tmp/b.txt
          diff /tmp/a.txt /tmp/b.txt

  the-image-builds:
    # §6.2's image, built in one process against the real repository — docs/98. `cargo test` holds
    # the build against fixtures; this is the rung above, and it is the only place the *fetch* runs
    # at all: an index resolved from packages.wolfi.dev, real APKs unpacked, and the digest
    # compared across two builds. §19.4 item 10 — an artefact nobody has executed is a design
    # document — is why this is a job rather than a paragraph.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: build
        run: cargo build --release

      - name: the image builds, from the repository, with no external tool
        run: |
          ./target/release/beck image examples/todo.beck --out /tmp/image --cache /tmp/apks
          test -f /tmp/image/oci-layout
          test -f /tmp/image/index.json
          # Nothing in this step is apko, melange, docker or a registry client.

      - name: the same inputs produce the same digest
        # §6.2's reproducibility claim, mechanised per build — docs/28 §28.2 item 3. The cache is
        # warm, so the second build resolves the same package versions the first did; a digest
        # that moved here would mean something in the build read a clock.
        run: |
          ./target/release/beck image examples/todo.beck --out /tmp/image-again --cache /tmp/apks
          diff /tmp/image/index.json /tmp/image-again/index.json

      - name: the signature verifies, and refuses a different image
        run: |
          ./target/release/beck key generate --out /tmp/cosign
          ./target/release/beck sign /tmp/image --key /tmp/cosign.key
          ./target/release/beck verify /tmp/image --key /tmp/cosign.pub
          # The negative control: the signature must not verify against a key that did not make it.
          ./target/release/beck key generate --out /tmp/other
          if ./target/release/beck verify /tmp/image --key /tmp/other.pub; then
            echo "a signature verified against the wrong key"; exit 1
          fi

      - name: a real package reads, and not only a fixture
        # `image.rs` builds its fixtures with `tar czf`, which is not the three-gzip-member
        # concatenation a real APK is. This is where that shape is exercised, against the packages
        # the step above already fetched.
        env:
          BECK_APK_CACHE: /tmp/apks/packages.wolfi.dev/os/x86_64
          BECK_REQUIRE_APK: "1"
          BECK_REQUIRE_TAR: "1"
          BECK_REQUIRE_OPENSSL: "1"
        run: cargo test --test image -- --nocapture

      - name: the workflow `beck init ci` writes is the one it claims to write
        run: |
          mkdir -p /tmp/app && cp examples/todo.beck /tmp/app/app.beck
          cd /tmp/app && "$GITHUB_WORKSPACE/compiler/target/release/beck" init ci app.beck
          test -f /tmp/app/.github/workflows/beck.yml
          python3 -c "import yaml,sys; yaml.safe_load(open('/tmp/app/.github/workflows/beck.yml'))"

  budgets:
    # Deterministic budgets only — the ones §8.3 calls gates.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: thin-client payload (§5.1 target < 10 KB brotli)
        # `shell: bash` turns on pipefail — without it a missing `brotli` makes `br` zero and the
        # gate passes at 0 bytes. `command -v` names that failure.
        shell: bash
        run: |
          command -v brotli
          f=crates/beck-rt/client/beck-thin.js
          raw=$(wc -c < "$f")
          br=$(brotli -c -q 11 "$f" | wc -c)
          echo "thin client: ${raw} B raw, ${br} B brotli (budget 10240)"
          test "$br" -lt 10240

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - name: Mode B component bundles (§5.1 budget < 150 KB brotli)
        # §8.6's Mode B bullet asks for this by name: "size budget CI gate (< 150 KB brotli per
        # component bundle)". It is the *component* that is budgeted and not the kernel — the
        # kernel is one program-independent download every component of every Beck application
        # shares, and docs/94 §94.6 measures it separately for that reason.
        #
        # Every Mode B example in the tree, not one of them: a budget checked against a single
        # program is a budget about that program.
        shell: bash
        working-directory: compiler
        run: |
          command -v brotli
          cargo build --release -p beck-cli
          for f in examples/board.beck examples/editor.beck; do
            ./target/release/beck bundle "$f" --out /tmp/bundle.bpk
            raw=$(wc -c < /tmp/bundle.bpk)
            br=$(brotli -c -q 11 /tmp/bundle.bpk | wc -c)
            echo "$f: ${raw} B raw, ${br} B brotli (budget 153600)"
            test "$br" -lt 153600
          done

  measurements:
    # Reported, never thresholded (§13.7): the release-profile runs the phase reports quote, so
    # the published numbers stay reproducible (docs/adr/0006).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ubuntu-latest ships clang, so a skipped native measurement here would mean docs/93 §93.5's
      # table stopped being reproducible without anything saying so.
      BECK_REQUIRE_LLVM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - name: the phase 2 and phase 3 measurements, printed
        run: |
          cargo test --release --test measure_phase2 -- --nocapture
          cargo test --release --test measure_incremental -- --nocapture
          cargo test --release --test shared_arrangements -- --nocapture
          # docs/53 §53.3. Printed, never thresholded, and no comparative claim: docs/25 §25.9
          # holds those until there is a second backend for them to be about.
          cargo test --release --test measure_awfy -- --nocapture
          # docs/68 §68.5. The same rule, and one more qualification stated there: every port runs
          # the Game's format-checking size, because that is the only size it publishes an oracle
          # for.
          cargo test --release --test measure_clbg -- --nocapture
          # docs/64. The front end per phase and per program, and §13.7's keystroke→diagnostic
          # latency. Printed, never thresholded — the *gate* is `compile_speed`, which asserts a
          # shape rather than a rate and runs under `cargo test` above.
          cargo test --release --test measure_compile -- --nocapture
          # docs/93 §93.5. The native backend against the tree-walker, at two sizes each, plus the
          # pipe round trip on its own and what `clang -O2` costs. The *gate* is a shape — the
          # ratio must not fall as the problem grows — and it runs here rather than under
          # `cargo test` because it is a release measurement. docs/97 §97.5's comparison of the two
          # code generators is in the same file and release-only for a stronger reason: a debug
          # build measures our unoptimised Cranelift against a distribution's optimised `clang`.
          cargo test --release --test measure_native -- --nocapture
          # docs/93 §93.5's second table: the same four benchmarks in six languages. The *gate* is
          # that every implementation computes the same four answers, and it runs under `cargo test`
          # above; what runs here is the timing. A language this runner lacks prints a skip.
          cargo test --release --test measure_xlang -- --nocapture
          # The evaluator's host stack per level of non-tail recursion, in both profiles — the
          # number `beck_eval::STACK_BYTES` is chosen from, and the equality that says a tail call
          # costs nothing (docs/27 §27.2, §27.2). It prints in release and gates in either.
          cargo test -p beck-eval -- --nocapture
          cargo test --release -p beck-eval -- --nocapture

  licences:
    # §8.3 practice 5. The full `check`, advisories included (docs/adr/0004). cargo-deny ships
    # its own binary, so no Rust toolchain is installed here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: compiler/Cargo.toml
          arguments: --workspace
          command: check
