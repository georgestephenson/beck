[workspace]
resolver = "2"
members = [
    "crates/beck-diag",
    "crates/beck-syntax",
    "crates/beck-macro",
    "crates/beck-core",
    "crates/beck-eval",
    "crates/beck-llvm",
    "crates/beck-rt",
    "crates/beck-infra",
    "crates/beck-db",
    "crates/beck-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Path *and* version: a path dependency with no version requirement is a wildcard, and §7.9's
# "pinning — everything, always" does not carve out our own crates.
beck-diag = { path = "crates/beck-diag", version = "0.1.0" }
beck-syntax = { path = "crates/beck-syntax", version = "0.1.0" }
beck-macro = { path = "crates/beck-macro", version = "0.1.0" }
beck-core = { path = "crates/beck-core", version = "0.1.0" }
beck-eval = { path = "crates/beck-eval", version = "0.1.0" }
beck-llvm = { path = "crates/beck-llvm", version = "0.1.0" }
beck-rt = { path = "crates/beck-rt", version = "0.1.0" }
beck-infra = { path = "crates/beck-infra", version = "0.1.0" }
beck-db = { path = "crates/beck-db", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
insta = "1"
# The `beck` binary's global allocator. A tree-walker allocates a frame per call and a scope per
# `let`, and a third of the process was inside glibc's `malloc` before this (docs/adr/0019).
mimalloc = "0.1.52"
# The Kubernetes API's own types, generated from its OpenAPI schema. `beck-infra` builds objects
# rather than strings so that a wrong field name is a compile error; see `crates/beck-infra/src/k8s.rs`.
k8s-openapi = { version = "0.28", features = ["v1_34"] }
logos = "0.16"
proptest = "1"
# Default features pull `heapless` 0.7, whose `atomic-polyfill` is unmaintained
# (RUSTSEC-2023-0089). We serialise into `Vec`, so `alloc` is all we need.
postcard = { version = "1", default-features = false, features = ["alloc"] }
redb = "2"
# Bundled: SQLite is compiled from the vendored amalgamation rather than linked against
# whatever the host has, so a log written on a laptop and a log written in CI are written by the
# same engine (docs/adr/0017).
rusqlite = { version = "0.37", features = ["bundled"] }
salsa = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A maintained fork of the archived `serde_yaml`, used only in tests: `beck-infra` writes YAML with
# its own deterministic writer, and reads it back with somebody else's parser so the round-trip is
# not the writer marking its own homework.
serde_norway = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

