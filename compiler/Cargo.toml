[workspace]
resolver = "2"
members = [
    "crates/beck-diag",
    "crates/beck-syntax",
    "crates/beck-macro",
    "crates/beck-prim",
    "crates/beck-core",
    "crates/beck-eval",
    "crates/beck-host",
    "crates/beck-llvm",
    "crates/beck-clif",
    "crates/beck-wasm",
    "crates/beck-wasmgen",
    "crates/beck-play",
    "crates/beck-rt",
    "crates/beck-infra",
    "crates/beck-db",
    "crates/beck-cli",
]

[workspace.package]
# `docs/28-releases-and-deployment.md` §28.2 item 4: `0.x` minor per phase-sized increment, and no
# stability promise before Phase 5's specification. The minor counts *phases*, not releases — this
# is the third — and `release/version.sh` reads it, so a tag that disagrees fails the build rather
# than publishing a binary whose `--version` contradicts the page it came from.
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# Path *and* version: a path dependency with no version requirement is a wildcard, and §7.9's
# "pinning — everything, always" does not carve out our own crates.
beck-diag = { path = "crates/beck-diag", version = "0.3.0" }
beck-syntax = { path = "crates/beck-syntax", version = "0.3.0" }
beck-macro = { path = "crates/beck-macro", version = "0.3.0" }
# The runtime library: linked into the compiler as an rlib so the evaluator calls it, and
# built as a static archive the native backends link into what they compile (docs/93 §93.12).
beck-prim = { path = "crates/beck-prim", version = "0.3.0" }
beck-core = { path = "crates/beck-core", version = "0.3.0" }
beck-eval = { path = "crates/beck-eval", version = "0.3.0" }
beck-host = { path = "crates/beck-host", version = "0.3.0" }
beck-llvm = { path = "crates/beck-llvm", version = "0.3.0" }
beck-clif = { path = "crates/beck-clif", version = "0.3.0" }
beck-wasm = { path = "crates/beck-wasm", version = "0.3.0" }
beck-wasmgen = { path = "crates/beck-wasmgen", version = "0.3.0" }
beck-play = { path = "crates/beck-play", version = "0.3.0" }
beck-rt = { path = "crates/beck-rt", version = "0.3.0" }
# `default-features = false` here so a member can decline the image half; a member cannot turn
# off a default the workspace entry enables. `beck-cli` asks for `image` explicitly.
beck-infra = { path = "crates/beck-infra", version = "0.3.0", default-features = false }
beck-db = { path = "crates/beck-db", version = "0.3.0" }

anyhow = "1"
async-trait = "0.1"
# One dependency, two capabilities: rustls's default cryptography provider is also the library the
# OIDC relying party verifies an RSA or ECDSA signature with, so the asymmetric half of `beck-rt`'s
# identity work costs no second crate (docs/adr/0023).
aws-lc-rs = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
# §7.3's *dev* codegen, taken as a crate where §7.3's release codegen is taken as a run-time
# requirement. Cranelift is pure Rust and emits an object file, so `beck-clif` needs no `unsafe`
# and no LLVM on the machine — see `docs/adr/0024`.
cranelift-codegen = { version = "0.134", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = { version = "0.134", default-features = false, features = ["std"] }
cranelift-module = { version = "0.134", default-features = false, features = ["std"] }
cranelift-object = "0.134"
# DEFLATE, in both directions: an APK is a concatenation of gzip members and an OCI layer is a
# gzipped tar, so the in-process image build cannot read its inputs or write its output without an
# implementation of it. The default backend is `miniz_oxide`, which is Rust rather than a vendored
# zlib — the only reason this is one line and not a build-tooling decision (docs/adr/0025).
flate2 = "1"
futures-util = "0.3"
insta = "1"
# The `beck` binary's global allocator. A tree-walker allocates a frame per call and a scope per
# `let`, and a third of the process was inside glibc's `malloc` before this (docs/adr/0019).
mimalloc = "0.1.52"
# The Kubernetes API's own types, generated from its OpenAPI schema. `beck-infra` builds objects
# rather than strings so that a wrong field name is a compile error; see `crates/beck-infra/src/k8s.rs`.
k8s-openapi = { version = "0.28", features = ["v1_34"] }
logos = "0.16"
proptest = "1"
# Default features pull `heapless` 0.7, whose `atomic-polyfill` is unmaintained
# (RUSTSEC-2023-0089). We serialise into `Vec`, so `alloc` is all we need.
postcard = { version = "1", default-features = false, features = ["alloc"] }
redb = "2"
# §7's TLS row, taken. The default cryptography provider is `aws-lc-rs`, which is the row as
# written; `webpki-roots` is the Mozilla trust store as data, so a container built by apko needs no
# `ca-certificates` package for an outbound call to verify a name (docs/adr/0023).
rustls = "0.23"
# Bundled: SQLite is compiled from the vendored amalgamation rather than linked against
# whatever the host has, so a log written on a laptop and a log written in CI are written by the
# same engine (docs/adr/0017).
rusqlite = { version = "0.37", features = ["bundled"] }
salsa = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A maintained fork of the archived `serde_yaml`, used only in tests: `beck-infra` writes YAML with
# its own deterministic writer, and reads it back with somebody else's parser so the round-trip is
# not the writer marking its own homework.
serde_norway = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-rustls = "0.26"
tokio-tungstenite = "0.30"
target-lexicon = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

