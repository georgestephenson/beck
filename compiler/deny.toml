# `cargo-deny` licence and advisory gate — §8.3 practice 5: "from the first commit, given §7's
# open-source constraint".
#
#   cargo deny check
#
# The policy is §7's, mechanised: permissive or weak-copyleft only, nothing BUSL/SSPL/proprietary.

[licenses]
# Anything not on this list fails the build, which is the point: the licence policy is enforced by
# machine, not by memory. Entries are the licences §7 permits, whether or not today's dependency
# set happens to use them — this is the policy, not an inventory.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",             # weak copyleft, file-level: allowed by §7 (OpenTofu is the precedent)
    "BSL-1.0",             # Boost, not Business Source
    # Covers the Mozilla root CA bundle that `webpki-root-certs` ships (reached via kube's TLS
    # verifier). It licenses *data*, not code, and is permissive with no reciprocal obligation —
    # inside §7's constraint, and named explicitly rather than waved through.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# An allowed licence nobody currently depends on is not a problem to report: the list above states
# what Beck may take on, and shrinking it to today's graph would make it a changelog instead.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# No exceptions, including for our own crates: a path dependency carries a version requirement
# (see the workspace manifest).
wildcards = "deny"
# Named exclusions rather than a blanket allow: a BUSL/SSPL dependency must fail loudly.
deny = []

[advisories]
yanked = "deny"
# An allowance that has outlived its reason is the failure mode a one-entry `ignore` list invites:
# the crate moves on, nobody deletes the line, and the next yank of the same crate is waved through
# by a permission granted for something else. `cargo-deny` notices — it reports `yanked-not-detected`
# when an ignore entry matches nothing — but as a warning, which no CI job reads. This makes it a
# denial, so the entry below stops the build the day it stops being needed.
unused-ignored-advisory = "deny"
# An advisory is fixed at the root — by dropping the feature or the dependency that pulls it in —
# rather than muted here. `postcard`'s default features were removed for exactly this reason
# (RUSTSEC-2023-0089 via heapless → atomic-polyfill). This list was empty until the entry below,
# which is a *yank*, not an advisory, and is the one case where fixing at the root is the unsafe
# move.
#
# `arrayref 0.3.9` was yanked from crates.io on 2026-08-20 and this gate went red the same day. The
# fix `cargo-deny` itself suggests — `cargo update -p arrayref` — resolves to **0.3.10, which is
# malicious**: it adds a normal dependency on `proc-macro1`, a name one character from
# `proc-macro2`, published at `proc-macro2`'s own latest version numbers (1.0.106 and 1.0.107 are
# the only two it has ever had) and copying its feature set exactly. That crate declares `ureq`,
# `rustls` and `base64` as **build** dependencies, so an HTTP client and a TLS stack run inside a
# build script during compilation. `arrayref` is two hundred lines of macros for taking array
# references and 0.3.9 has no runtime dependencies at all.
#
# So the yanked version is the safe one and the current one is the attack. We hold 0.3.9 — reached
# through `blake3` — and this entry is what lets the gate stay `deny` for everything else.
# `DEFECTS.md::arrayref-is-pinned-to-a-yanked-version` is the reminder to delete it, and names what
# has to be true first.
ignore = [{ crate = "arrayref@0.3.9", reason = "0.3.10 depends on the proc-macro1 typosquat, which runs ureq in a build script; 0.3.9 is the last clean release" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# §7.9: "no git dependencies in released artefacts — registry releases only".
allow-git = []
