[package]
name = "beck-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
beck-core.workspace = true
beck-diag.workspace = true
beck-host.workspace = true
anyhow.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
blake3.workspace = true
futures-util.workspace = true
postcard.workspace = true
redb.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Test-only: a certificate authority made a moment before it is used, so the outbound client's TLS
# path is exercised by a real handshake rather than asserted to compile. Nothing in the artefact
# depends on it, and `docs/adr/0021` says why a checked-in certificate is worse.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
