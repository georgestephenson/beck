[package]
name = "beck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "beck"
path = "src/main.rs"

[dependencies]
beck-core.workspace = true
beck-db.workspace = true
beck-diag.workspace = true
beck-eval.workspace = true
beck-infra.workspace = true
beck-macro.workspace = true
beck-rt.workspace = true
beck-syntax.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
# The harnesses exercise the compiler and the runtime *together* — §4.8's differential and
# replay-determinism suites are properties of the whole pipeline, not of any one crate — so they
# live beside the binary that already depends on all of it.
tokio = { workspace = true }
# The subscription harness drives `beck_rt::session::run` over an in-memory socket, which is what
# the `Socket` trait was written for: "the upgraded socket in the server, and an in-memory duplex in
# the tests".
futures-util.workspace = true
tokio-tungstenite.workspace = true
