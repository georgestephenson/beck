[package]
name = "beck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "beck"
path = "src/main.rs"

[dependencies]
beck-core.workspace = true
beck-db.workspace = true
beck-diag.workspace = true
beck-eval.workspace = true
beck-infra.workspace = true
beck-clif.workspace = true
beck-llvm.workspace = true
beck-macro.workspace = true
beck-rt.workspace = true
beck-syntax.workspace = true
anyhow.workspace = true
clap.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
# The harnesses exercise the compiler and the runtime *together* — §4.8's differential and
# replay-determinism suites are properties of the whole pipeline, not of any one crate — so they
# live beside the binary that already depends on all of it.
tokio = { workspace = true }
# The subscription harness drives `beck_rt::session::run` over an in-memory socket, which is what
# the `Socket` trait was written for: "the upgraded socket in the server, and an in-memory duplex in
# the tests".
futures-util.workspace = true
tokio-tungstenite.workspace = true
# `read_models.rs` drives the pgwire edge with somebody else's Postgres client rather than with a
# hand-rolled one: a protocol server tested only by the code that wrote it tests agreement with
# itself. It is already a dependency of `beck-rt` for the Postgres log store.
tokio-postgres.workspace = true
# `clbg.rs` recomputes the digest of the Benchmarks Game's two 10 KB published outputs, so that the
# hexadecimal a port asserts is derived from the checked-in file rather than chosen. It is the same
# BLAKE3 the `digest` primitive is, which is what makes the two comparable.
blake3.workspace = true
# `oidc.rs` plays the identity provider: it generates a signing key and signs the tokens the relying
# party then verifies, so no token in that harness was written by the code that checks it. Already a
# dependency of `beck-rt` (docs/adr/0023).
aws-lc-rs.workspace = true
# `mode_b.rs` drives the Mode B client kernel natively. The kernel is a `cdylib` for the browser and
# an `rlib` here, which is what makes its behaviour gateable without one.
beck-wasm.workspace = true
