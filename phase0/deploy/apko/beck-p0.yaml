# The container image, declaratively — no Dockerfile, no daemon, no build-time package manager.
#
# §6.2: because an apko build performs no arbitrary execution, the same config and package
# versions yield the same image digest on any machine. That is what makes `beck build` a pure
# function from source to digest, and therefore what makes the deployment plan cacheable and
# auditable.
#
# The contents below are the whole "operating system" of a Beck service: CA certificates, time
# zones, and a statically linked binary that is compiler output. There is no shell, no package
# manager, no init — "there is no distro to choose, patch, or harden, because the userland *is*
# compiler output".
#
#   Build (needs apko; nothing else, and no root):
#     cargo build --release --target x86_64-unknown-linux-musl -p beck-p0-server
#     cp target/x86_64-unknown-linux-musl/release/beck-p0 deploy/apko/beck-p0
#     apko build deploy/apko/beck-p0.yaml ghcr.io/beck/phase0-todo:dev beck-p0.tar
#
#   Reproducibility check (the property this file exists for):
#     apko build ... a.tar && apko build ... b.tar && diff <(sha256sum <a.tar) <(sha256sum <b.tar)
#
#   Sign and attest (§6.2):
#     cosign sign --yes ghcr.io/beck/phase0-todo@sha256:<digest>
#     cosign attest --yes --type spdxjson --predicate sbom.spdx.json ghcr.io/beck/...

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Pinned to exact versions at adoption (§7.9: "a build that cannot state exactly what it
    # contains cannot claim reproducibility"). Left unpinned here because Phase 0 never ran a
    # build — see docs/18-phase-0-report.md.
    - ca-certificates-bundle
    - tzdata

entrypoint:
  command: /usr/bin/beck-p0

cmd: run --store postgres --addr 0.0.0.0:8080

# Non-root, matching the generated pod's securityContext exactly. A mismatch here is the classic
# "works locally, CrashLoopBackOff in the cluster".
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

paths:
  - path: /usr/bin/beck-p0
    type: hardlink
    source: /beck-p0
    uid: 65532
    gid: 65532
    permissions: 0o755

# Cross-compiled, so the multi-arch index costs us nothing (§6.2).
archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/georgestephenson/beck
  org.opencontainers.image.description: >-
    Phase 0 of Beck: the todo sketch, hand-written as the output the compiler will generate.
  org.opencontainers.image.licenses: Apache-2.0
