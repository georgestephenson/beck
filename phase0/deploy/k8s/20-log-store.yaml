---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: beck-postgres
  name: beck-postgres
  namespace: beck-todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beck-postgres
  serviceName: beck-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beck-postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: beck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: beck-postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          image: postgres:17-alpine
          name: postgres
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: beck-postgres
  name: beck-postgres
  namespace: beck-todo
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: beck-postgres
